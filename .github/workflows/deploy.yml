name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # - name: Login to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ secrets.GHCR_USERNAME }}
      #     password: ${{ secrets.ACCESS_TOKEN }}

      # - name: Build & Push EMR Image
      #   run: |
      #     docker build -t ghcr.io/${{secrets.GHCR_USERNAME}}/emr-portal-app:latest .
      #     docker push ghcr.io/${{secrets.GHCR_USERNAME}}/emr-portal-app:latest

      # - name: Build & Push Nginx Image
      #   run: |
      #     docker build \
      #       -f infra/Dockerfile.nginx \
      #       -t ghcr.io/${{secrets.GHCR_USERNAME}}/emr-nginx:latest .
      #     docker push ghcr.io/${{secrets.GHCR_USERNAME}}/emr-nginx:latest

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          # authkey: ${{ secrets.TS_AUTH_KEY }}
          oauth-client-id: ${{secrets.TS_CLIENT_ID}}
          oauth-secret: ${{secrets.TS_CLIENT_SECRET}}
          hostname: github-actions-ci
          tags: tag:productions

      - name: Ping Server
        run: ping -c 3 100.114.76.111

      - name: SSH Into Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.114.76.111
          key: ${{secrets.HOST_PRIVATE_SSH_KEY}}
          fingerprint: ""
          username: mcadmin
          debug: true
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /var/www/hmis
            git checkout main
            git pull

            SHA_FILE=.last_deployed_sha          # add to .gitignore
            NEW_SHA=$(git rev-parse HEAD)
            OLD_SHA=$(cat "$SHA_FILE" 2>/dev/null || true)

            # If there's no record (first run) or the old commit no longer exists (force push), treat everything as changed
            if [ -n "$OLD_SHA" ] && git cat-file -e "$OLD_SHA^{commit}" 2>/dev/null; then
                CHANGED_FILES=$(git diff --name-only "$OLD_SHA" "$NEW_SHA")
            else
                OLD_SHA=""
                CHANGED_FILES=""
            fi

            # true if no baseline, or any changed file matches the regex
            changed() { [ -z "$OLD_SHA" ] || echo "$CHANGED_FILES" | grep -qE "$1"; }

            # --- PHP dependencies ---
            if changed '^composer\.(json|lock)$' || [ ! -d vendor ]; then
                composer install --no-interaction --prefer-dist --optimize-autoloader
            else
                echo "Composer files unchanged, skipping install."
            fi

            # --- Migrations (migrate is already a no-op when nothing is pending) ---
            php artisan migrate --force -n --isolated

            # --- Node dependencies ---
            if changed '^package(-lock)?\.json$' || [ ! -d node_modules ]; then
                npm ci
            else
                echo "Node deps unchanged, skipping npm ci."
            fi

            # --- Asset build ---
            ASSETS_BUILT=0
            if changed '^(resources/|package(-lock)?\.json$|vite\.config\.|tailwind\.config\.|postcss\.config\.)' || [ ! -d public/build ]; then
                npm run build
                ASSETS_BUILT=1
            else
                echo "No frontend changes, skipping build."
            fi

            # --- Seeder (only when seeders changed) ---
            if changed '^database/seeders/'; then
                php artisan db:seed --class=RoleAndPermissionSeeder --force
            fi

            # --- Cache purge only if assets changed ---
            if [ "$ASSETS_BUILT" = 1 ]; then
                ./cloudflare_purge.sh
            fi

            sudo -u www-data php artisan octane:reload || {
                sudo supervisorctl restart octane
            }

            # Only reached if every step above succeeded (set -e)
            echo "$NEW_SHA" > "$SHA_FILE"
            sudo supervisorctl restart "queue:*" schedule websocket
